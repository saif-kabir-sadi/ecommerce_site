<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Furniro Ecommerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Sign Up</h2>
        <form id="signupForm" method="POST" action="/signup">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="1" max="120" required>
            <label for="birthdate">Birthdate:</label>
            <input type="date" id="birthdate" name="birthdate" required>
            <button type="submit">Sign Up</button>
        </form>
        <div id="signupMessage"></div>
        <div class="signup-link">
            <p>Already have an account?</p>
            <a href="login.html"><button type="button" class="signup-btn">Login</button></a>
        </div>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;
            const age = document.getElementById('age').value;
            const birthdate = document.getElementById('birthdate').value;
            const res = await fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, email, age, birthdate })
            });
            const data = await res.json();
            document.getElementById('signupMessage').textContent = data.message;
            if (data.success) {
                window.location.href = 'login.html'; // Redirect to login on success
            }
        });
    </script>
</body>
</html>
